name: Validate Olympus release hub

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate repository layout
        shell: bash
        run: |
          set -euo pipefail

          allowed_root=(
            ".github"
            "README.md"
            "channels"
            "docs"
            "release-index.json"
          )

          mapfile -t root_entries < <(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          for entry in "${root_entries[@]}"; do
            [[ "$entry" == ".git" ]] && continue
            allowed=false
            for expected in "${allowed_root[@]}"; do
              if [[ "$entry" == "$expected" ]]; then
                allowed=true
                break
              fi
            done
            if [[ "$allowed" != true ]]; then
              echo "Unexpected root entry: $entry"
              exit 1
            fi
          done

      - name: Reject source code and committed release artifacts
        shell: bash
        run: |
          set -euo pipefail

          if find . -path './.git' -prune -o -type f \(             -name '*.go' -o -name '*.js' -o -name '*.ts' -o -name '*.tsx' -o             -name '*.jsx' -o -name '*.py' -o -name '*.rs' -o -name '*.c' -o             -name '*.cc' -o -name '*.cpp' -o -name '*.h' -o -name '*.java' -o             -name '*.class' -o -name '*.exe' -o -name '*.dll' -o -name '*.so' -o             -name '*.dylib' -o -name '*.tar' -o -name '*.tar.gz' -o -name '*.tgz' -o             -name '*.zip' -o -name '*.deb' -o -name '*.rpm'           \) -print | grep -q .; then
            echo "Source code or release artifacts must not be committed to this repository."
            exit 1
          fi

          for forbidden in Dockerfile docker-compose.yml go.mod go.sum package.json Cargo.toml Makefile; do
            if find . -path './.git' -prune -o -name "$forbidden" -print | grep -q .; then
              echo "Forbidden development file found: $forbidden"
              exit 1
            fi
          done

      - name: Validate product index and release channels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          HUB = "https://github.com/Jojje84/Olympus-Releases"
          index_path = Path("release-index.json")
          index = json.loads(index_path.read_text(encoding="utf-8"))

          assert index.get("schema_version") == 1
          assert index.get("hub") == "Olympus"
          assert index.get("releases_url") == f"{HUB}/releases"

          products = index.get("products")
          assert isinstance(products, dict) and products

          expected = {"unicore", "forgecore"}
          assert expected.issubset(products), "UniCore and ForgeCore must be indexed"

          for product_id, meta in products.items():
              display_name = meta.get("display_name")
              channel_path = meta.get("stable_channel")
              prefix = meta.get("release_tag_prefix")

              assert isinstance(display_name, str) and display_name.strip()
              assert isinstance(channel_path, str) and channel_path.startswith(f"channels/{product_id}/")
              assert isinstance(prefix, str) and prefix == f"{product_id}-"

              path = Path(channel_path)
              assert path.is_file(), f"Missing channel file: {path}"
              payload = json.loads(path.read_text(encoding="utf-8"))

              assert payload.get("schema_version") == 1
              assert payload.get("product") == display_name
              assert payload.get("product_id") == product_id
              assert payload.get("channel") == "stable"
              assert payload.get("status") in {"pre-release", "stable"}
              assert payload.get("releases_url") == f"{HUB}/releases"
              assert payload.get("release_tag_prefix") == prefix

              latest = payload.get("latest")
              if latest is None:
                  assert payload["status"] == "pre-release"
                  continue

              assert payload["status"] == "stable"
              assert isinstance(latest, dict)
              for key in ("version", "tag", "release_tag", "url", "published_at", "source_revision"):
                  value = latest.get(key)
                  assert isinstance(value, str) and value.strip(), f"{product_id}: latest.{key} is required"

              assert latest["tag"] == f"v{latest['version']}"
              assert latest["release_tag"] == f"{prefix}{latest['tag']}"
              assert latest["url"] == f"{HUB}/releases/tag/{latest['release_tag']}"

              signing = latest.get("signing")
              assert isinstance(signing, dict)
              assert signing.get("format") == "sigstore-bundle"
              assert signing.get("bundle_suffix") == ".sigstore.json"
              assert signing.get("oidc_issuer") == "https://token.actions.githubusercontent.com"
              identity = signing.get("workflow_identity")
              assert isinstance(identity, str) and identity.endswith(f"@refs/tags/{latest['tag']}")

              license_url = payload.get("license_url")
              if license_url is not None:
                  assert latest.get("license") == license_url

          print("Olympus release index and product channels are valid")
          PY

      - name: Verify required public documentation
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s release-index.json
          test -s channels/unicore/stable.json
          test -s channels/forgecore/stable.json
          test -s docs/REPOSITORY_POLICY.md
          test -s docs/unicore/INSTALL.md
          test -s docs/unicore/VERIFY.md
          test -s docs/unicore/LICENSE.md
          test -s docs/unicore/RASPBERRY_PI.md
          test -s docs/forgecore/README.md
          test -s .github/SECURITY.md
          test -s .github/CODEOWNERS
