name: Validate Olympus release hub

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate repository layout
        shell: bash
        run: |
          set -euo pipefail

          allowed_root=(
            ".github"
            "README.md"
            "channels"
            "docs"
            "products"
            "release-channel.json"
            "release-index.json"
          )

          mapfile -t root_entries < <(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          for entry in "${root_entries[@]}"; do
            [[ "$entry" == ".git" ]] && continue

            allowed=false
            for expected in "${allowed_root[@]}"; do
              if [[ "$entry" == "$expected" ]]; then
                allowed=true
                break
              fi
            done

            if [[ "$allowed" != true ]]; then
              echo "Unexpected root entry: $entry"
              exit 1
            fi
          done

      - name: Reject source code and committed release archives
        shell: bash
        run: |
          set -euo pipefail

          if find . -path './.git' -prune -o -type f \(             -name '*.go' -o -name '*.js' -o -name '*.ts' -o -name '*.tsx' -o             -name '*.jsx' -o -name '*.py' -o -name '*.rs' -o -name '*.c' -o             -name '*.cc' -o -name '*.cpp' -o -name '*.h' -o -name '*.java' -o             -name '*.class' -o -name '*.exe' -o -name '*.dll' -o -name '*.so' -o             -name '*.dylib' -o -name '*.tar' -o -name '*.tar.gz' -o -name '*.tgz' -o             -name '*.zip' -o -name '*.deb' -o -name '*.rpm'           \) -print | grep -q .; then
            echo "Source code or release archives must not be committed to this repository."
            exit 1
          fi

          for forbidden in Dockerfile docker-compose.yml go.mod go.sum package.json Cargo.toml Makefile; do
            if find . -path './.git' -prune -o -name "$forbidden" -print | grep -q .; then
              echo "Forbidden development file found: $forbidden"
              exit 1
            fi
          done

      - name: Validate release index and product channels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          index = json.loads(Path("release-index.json").read_text(encoding="utf-8"))
          assert index.get("schema_version") == 1
          assert index.get("hub") == "Olympus-Releases"

          expected = {
              "unicore": ("UniCore", "channels/unicore/stable.json", "unicore-"),
              "forgecore": ("ForgeCore", "channels/forgecore/stable.json", "forgecore-"),
          }

          products = index.get("products")
          assert isinstance(products, dict)

          for key, (name, channel_path, prefix) in expected.items():
              product = products.get(key)
              assert isinstance(product, dict)
              assert product.get("name") == name
              assert product.get("channel") == channel_path
              assert product.get("releases_prefix") == prefix

              path = Path(channel_path)
              payload = json.loads(path.read_text(encoding="utf-8"))
              assert payload.get("schema_version") == 1
              assert payload.get("product") == name
              assert payload.get("channel") == "stable"
              assert payload.get("status") in {"pre-release", "stable"}
              assert payload.get("releases_url") == "https://github.com/Jojje84/Olympus-Releases/releases"

              latest = payload.get("latest")
              if latest is None:
                  assert payload["status"] == "pre-release"
              else:
                  assert payload["status"] == "stable"
                  assert isinstance(latest, dict)
                  for required in ("version", "tag", "url", "published_at", "source_revision"):
                      value = latest.get(required)
                      assert isinstance(value, str) and value.strip(), f"{channel_path}: latest.{required} is required"
                  assert latest["tag"].startswith(prefix)
                  assert latest["url"].startswith("https://github.com/Jojje84/Olympus-Releases/releases/")

          legacy = json.loads(Path("release-channel.json").read_text(encoding="utf-8"))
          unicore = json.loads(Path("channels/unicore/stable.json").read_text(encoding="utf-8"))
          assert legacy == unicore, "Legacy UniCore release-channel.json must mirror channels/unicore/stable.json"

          print("Olympus release hub metadata is valid")
          PY

      - name: Verify required documentation
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s products/unicore/README.md
          test -s products/forgecore/README.md
          test -s docs/INSTALL.md
          test -s docs/VERIFY.md
          test -s docs/LICENSE.md
          test -s docs/REPOSITORY_POLICY.md
          test -s .github/SECURITY.md
          test -s .github/CODEOWNERS
