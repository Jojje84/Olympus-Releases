name: Cleanup merged branches

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main for authenticated git access
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Delete merged pull request branch
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          for candidate in "$BRANCH" "chore/harden-release-repository"; do
            if git ls-remote --exit-code --heads origin "$candidate" >/dev/null 2>&1; then
              git push origin --delete "$candidate"
            fi
          done
